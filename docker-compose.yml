version: '3.9'

services:
  # ── LuxSalon Next.js App ───────────────────────────────────────────────────
  app:
    build:
      context:   .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL:           ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV:          production
      PORT:              3000
    depends_on:
      redis:
        condition: service_healthy
    restart:   unless-stopped
    healthcheck:
      test:     ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3
    networks:
      - luxsalon

  # ── Redis (local fallback — use Upstash in production) ────────────────────
  redis:
    image:   redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - luxsalon
    restart: unless-stopped

  # ── Background Worker ─────────────────────────────────────────────────────
  worker:
    build:
      context:   .
      dockerfile: Dockerfile
    command:   node -e "require('./lib/scheduler').startScheduler(); setInterval(() => {}, 1e9)"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    depends_on:
      - app
      - redis
    restart:   unless-stopped
    networks:
      - luxsalon

  # ── Nginx Reverse Proxy (optional) ────────────────────────────────────────
  nginx:
    image:   nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - luxsalon
    restart:   unless-stopped
    profiles:
      - production   # Only start with: docker compose --profile production up

volumes:
  redis-data:

networks:
  luxsalon:
    driver: bridge
